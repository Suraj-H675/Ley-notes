[package]
name = "ley-desktop"
version = "0.1.0"
description = "Local continuity and cited project memory for coding agents"
authors = ["Suraj"]
license = "MIT OR Apache-2.0"
edition = "2021"

[lib]
name = "ley_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atomic-write-file.workspace = true
base64 = { workspace = true }
ley-core = { path = "../crates/ley-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "=2.11.0"
toml_edit = "0.25.12"
open = "=5.4.4"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }

[dev-dependencies]
tempfile.workspace = true
