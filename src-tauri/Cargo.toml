[package]
name = "ley-desktop"
version = "0.1.0"
description = "Local continuity and cited project memory for coding agents"
authors = ["Suraj"]
edition = "2021"

[lib]
name = "ley_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = { workspace = true }
ley-core = { path = "../crates/ley-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
open = "=5.4.4"
