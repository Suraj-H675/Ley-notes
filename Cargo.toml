[workspace]
members = ["crates/ley-cli", "crates/ley-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Suraj"]

[workspace.dependencies]
atomic-write-file = "0.3"
directories = "6"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
