[workspace]
members = ["crates/ley-cli", "crates/ley-core", "crates/ley-mcp", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Suraj"]

[workspace.dependencies]
atomic-write-file = "0.3"
cap-fs-ext = "4"
cap-std = "4"
cap-tempfile = "4"
directories = "6"
ignore = "0.4"
model2vec-rs = { version = "=0.2.1", default-features = false, features = ["local-only", "onig"] }
regex = "1"
rmcp = { version = "2.2", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }
toml = "0.9"
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
