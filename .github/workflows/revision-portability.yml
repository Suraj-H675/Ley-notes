name: Revision portability matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-portability:
    name: revision portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Report toolchain
        run: |
          git --version
          python --version
          rustc --version
          cargo --version

      - name: Build Ley CLI
        run: cargo build --locked -p ley-cli

      - name: Run revision compatibility matrix
        run: python eval/run_git_revision_compat_eval.py --require-all
