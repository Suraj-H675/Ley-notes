name: Revision portability matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-portability:
    name: revision portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-2025
          - windows-11-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Report toolchain
        run: |
          echo "runner.os=${{ runner.os }}"
          echo "runner.arch=${{ runner.arch }}"
          python -c "import os; print('runner.image.os=' + os.environ.get('ImageOS', 'unknown')); print('runner.image.version=' + os.environ.get('ImageVersion', 'unknown'))"
          git --version
          python --version
          rustc --version
          rustc -vV
          cargo --version

      - name: Report PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh --version

      - name: Build Ley CLI
        run: cargo build --locked -p ley-cli --features eval-private-root

      - name: Run revision compatibility matrix
        run: python eval/run_git_revision_compat_eval.py --require-all
