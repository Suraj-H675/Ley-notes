name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: release compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate third-party notices
        run: |
          set -euo pipefail
          test -s LICENSE-MIT
          test -s LICENSE-APACHE
          test "$(node -p "require('./package.json').license")" = 'MIT OR Apache-2.0'
          npm run prepare:third-party-notices
          test -s src-tauri/generated/THIRD_PARTY_NOTICES.txt
          grep -Fx 'LEY THIRD-PARTY NOTICES' src-tauri/generated/THIRD_PARTY_NOTICES.txt >/dev/null
          grep -E '^Packages: [1-9][0-9]*$' src-tauri/generated/THIRD_PARTY_NOTICES.txt >/dev/null
          ! grep -E '^Rust crate: ley-(cli|core|desktop|mcp) ' src-tauri/generated/THIRD_PARTY_NOTICES.txt

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build website
        run: npm run build:website

      - name: Build desktop UI
        run: npm run build:desktop-ui

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: rust + native
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri compile prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Report pinned Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust workspace check
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --no-deps > /tmp/ley-metadata.json
          python - <<'PY'
          import json
          metadata = json.load(open('/tmp/ley-metadata.json'))
          workspace = set(metadata['workspace_members'])
          bad = [(p['name'], p.get('license')) for p in metadata['packages'] if p['id'] in workspace and p.get('license') != 'MIT OR Apache-2.0']
          if bad:
              raise SystemExit(f'workspace package license mismatch: {bad}')
          PY
          cargo check --locked --workspace

      - name: Rust workspace tests
        run: cargo test --locked --workspace
